project:
  name: Vietnamese AI Speech Recognition
  experiment_name: vivos_phowhisper_base_smoke

model:
  name: vinai/PhoWhisper-base
  task: transcribe
  language: Vietnamese
  sample_rate: 16000

wav2vec2_model:
  name: nguyenvulebinh/wav2vec2-base-vietnamese-250h
  architecture: wav2vec2-ctc
  sample_rate: 16000
  decoder:
    enabled: false

data:
  dataset_name: vivos
  dataset_version: "1.0"
  root: data/raw/vivos
  train_split: train
  validation_split: validation
  test_split: test
  max_audio_seconds: 30
  validation_ratio: 0.1
  max_train_samples: 32
  max_validation_samples: 8
  max_test_samples: 16

text_normalization:
  domain_codes: [ST23D]

training:
  epochs: 1
  learning_rate: 0.000005
  train_batch_size: 1
  eval_batch_size: 1
  gradient_accumulation_steps: 4
  weight_decay: 0.01
  warmup_steps: 2
  max_grad_norm: 1.0
  gradient_checkpointing: true
  eval_steps: 4
  save_steps: 4
  logging_steps: 1
  save_total_limit: 2
  load_best_model_at_end: true
  dataloader_num_workers: 0
  seed: 42

evaluation:
  metrics: [wer, cer]
  generation_num_beams: 1
  max_length: 225
  no_repeat_ngram_size: 3
  repetition_penalty: 1.05
  compare_beam_sizes: [1, 5]

paths:
  processed_data: data/processed
  checkpoint_dir: checkpoints/vivos_phowhisper_base_smoke
  best_checkpoint: checkpoints/vivos_phowhisper_base_smoke/best
  metrics_dir: outputs/tables
  predictions_dir: outputs/predictions
  figures_dir: outputs/figures
  reports_dir: outputs/reports/phowhisper_smoke
