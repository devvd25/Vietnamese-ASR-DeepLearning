project:
  name: Vietnamese AI Speech Recognition
  experiment_name: vivos_cv21_phowhisper_adaptation

model:
  # Tiếp tục thích nghi từ checkpoint VIVOS tốt nhất; không ghi đè baseline cũ.
  name: checkpoints/vivos_phowhisper_base_full/best
  task: transcribe
  language: Vietnamese
  sample_rate: 16000

wav2vec2_model:
  name: nguyenvulebinh/wav2vec2-base-vietnamese-250h
  architecture: wav2vec2-ctc
  sample_rate: 16000
  decoder:
    enabled: true
    language_model_path: models/language_models/vietnamese_4gram/vi_lm_4grams.bin
    alpha: 1.0
    beta: 1.0
    beam_width: 100
    domain_codes: [ST23D]

data:
  dataset_name: vivos_common_voice
  dataset_version: "VIVOS 1.0 + Common Voice Vietnamese 21.0 (Kaggle mirror)"
  root: data/raw/vivos
  common_voice_root: data/raw/common-voice-vi-21/vi
  max_audio_seconds: 30
  max_transcript_characters: 500
  validation_ratio: 0.1
  common_voice_validation_ratio: 0.1
  common_voice_test_ratio: 0.1
  max_train_samples: null
  max_validation_samples: null
  max_test_samples: null

text_normalization:
  domain_codes: [ST23D]

training:
  epochs: 1
  learning_rate: 0.000002
  train_batch_size: 1
  eval_batch_size: 1
  gradient_accumulation_steps: 4
  weight_decay: 0.01
  warmup_steps: 250
  max_grad_norm: 1.0
  gradient_checkpointing: true
  # 14.756 mẫu / accumulation 4 = 3.689 optimizer steps; đánh giá và lưu cuối epoch.
  eval_steps: 3689
  save_steps: 3689
  logging_steps: 100
  save_total_limit: 2
  load_best_model_at_end: true
  dataloader_num_workers: 0
  seed: 42

evaluation:
  metrics: [wer, cer]
  generation_num_beams: 1
  max_length: 225
  no_repeat_ngram_size: 3
  repetition_penalty: 1.05
  compare_beam_sizes: [1, 5]

paths:
  processed_data: data/processed/vivos_cv21
  checkpoint_dir: checkpoints/vivos_cv21_phowhisper_adaptation
  best_checkpoint: checkpoints/vivos_cv21_phowhisper_adaptation/best
  metrics_dir: outputs/kaggle_cv21/tables
  predictions_dir: outputs/kaggle_cv21/predictions
  figures_dir: outputs/kaggle_cv21/figures
  reports_dir: outputs/kaggle_cv21/reports
